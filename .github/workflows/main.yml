#workflow.yaml
name: Build & Deploy
on:
  push:
    tags: "deploy"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create SSH key
        run: |
          mkdir -p ~/.ssh/
          echo "$KEY" > ../private.key
          sudo chmod 600 ../private.key
          echo "$HOSTS" > ~/.ssh/known_hosts
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{secrets.KEY}}
          SSH_KNOWN_HOSTS: ${{secrets.KNOWN_HOSTS}}
          SSH_KEY_PATH: ${{ github.workspace }}/../private.key
      - name: Deploy new version
        run: |
          cd ~/bots/SentryBot
          git fetch
          git reset --hard
          git pull
#sudo systemctl restart SentryBot
